[project]
name = "omni_ai"
authors = [{ name = "Neotec Integrated Solutions" }]
description = "A white-label AI assistant inside ERPNext and Frappe: chat, analysis, charts, report building and guarded actions."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
